# mise.toml — single source of truth for all CLI tools and runtimes.
# Replaces nix/config.nix.
#
# Update a tool: change the version here, commit, push.
# On a live machine/container/VPS: run `mise install` to apply.

[tools]
# ── Runtimes ──────────────────────────────────────────────────────────────────
go   = "1.26"
node = "24"       # required by Mason (LSP installer inside neovim)
python = "3.13"
uv     = "latest"
ruff   = "latest"
rust   = "stable"

# ── Kubernetes / Infra ────────────────────────────────────────────────────────
kubectl   = "1.35.3"
helm      = "4.1.3"
terraform = "1.14.8"

# ── Neovim + shell tooling ────────────────────────────────────────────────────
"aqua:neovim/neovim"         = "latest"
"github:junegunn/fzf"        = "latest"
"aqua:BurntSushi/ripgrep"    = "latest"
"aqua:sharkdp/fd"            = "latest"
"aqua:sharkdp/bat"           = "latest"
"aqua:jesseduffield/lazygit" = "latest"
"aqua:cli/cli"               = "latest"
"aqua:starship/starship"     = "latest"
"aqua:docker/cli"            = "latest"
"cargo:stylua"               = "latest"
"aqua:jqlang/jq"             = "latest"

# ── LSP servers ───────────────────────────────────────────────────────────────
"go:golang.org/x/tools/gopls"    = "latest"
"aqua:hashicorp/terraform-ls"    = "latest"
"aqua:terraform-linters/tflint"  = "latest"
"github:golangci/golangci-lint"  = "latest"
"aqua:terraform-docs/terraform-docs" = "latest"

[settings]
not_found_auto_install = false
yes = true
