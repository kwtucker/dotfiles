# mise.toml — single source of truth for all CLI tools and runtimes.
# Replaces nix/config.nix.
#
# Update a tool: change the version here, commit, push.
# On a live machine/container/VPS: run `mise install` to apply.

[tools]
# ── Runtimes ──────────────────────────────────────────────────────────────────
go   = "1.26"
node = "24"       # required by Mason (LSP installer inside neovim)
python = "3.13"
uv     = "latest"
ruff   = "latest"
rust   = "stable"
tmux   = "latest"

# ── Kubernetes / Infra ────────────────────────────────────────────────────────
kubectl   = "1.35.3"
helm      = "4.1.3"
terraform = "1.14.8"

# ── Neovim + shell tooling ────────────────────────────────────────────────────
"aqua:neovim/neovim"         = "latest"
"github:junegunn/fzf"        = "latest"
"aqua:BurntSushi/ripgrep"    = "latest"
"aqua:sharkdp/fd"            = "latest"
"aqua:sharkdp/bat"           = "latest"
"aqua:jesseduffield/lazygit" = "latest"
"conda:tig"                  = "latest"
"aqua:cli/cli"               = "latest"
"aqua:starship/starship"     = "latest"
"aqua:docker/cli"            = "latest"
"cargo:stylua"               = "latest"
"aqua:jqlang/jq"             = "latest"
"aqua:fullstorydev/grpcurl"  = "latest"

# ── LSP servers ───────────────────────────────────────────────────────────────
"go:golang.org/x/tools/gopls"    = "latest"
"aqua:hashicorp/terraform-ls"    = "latest"
"aqua:terraform-linters/tflint"  = "latest"
"github:golangci/golangci-lint"  = "latest"
"aqua:terraform-docs/terraform-docs" = "latest"

# ── AI agents ────────────────────────────────────────────────────────────────
# opencode v2 ships from opencode.ai rather than GitHub releases, so it needs
# mise's http backend. The "2" prefix resolves to the newest 2.x through
# version_list_url — a future v3 will not arrive without a deliberate bump
# here. Client-side only: intentionally absent from image/mise.workspace.toml.
[tools."http:opencode"]
version           = "2"
version_list_url  = "https://opencode.ai/update/api/latest/cli/npm"
version_json_path = ".version"

[tools."http:opencode".platforms]
linux-x64   = { url = "https://opencode.ai/files/bin/{{version}}/opencode-linux-x64.tar.gz" }
linux-arm64 = { url = "https://opencode.ai/files/bin/{{version}}/opencode-linux-arm64.tar.gz" }
macos-x64   = { url = "https://opencode.ai/files/bin/{{version}}/opencode-darwin-x64.zip" }
macos-arm64 = { url = "https://opencode.ai/files/bin/{{version}}/opencode-darwin-arm64.zip" }

[settings]
not_found_auto_install = false
yes = true
