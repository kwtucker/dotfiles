# mise.toml — single source of truth for all CLI tools and runtimes.
# Replaces nix/config.nix.
#
# Tools are pinned to exact versions by default so upgrades are deliberate and
# reproducible; language runtimes keep their minor range so patch releases flow.
# mise.lock records the exact resolved version, URL, and checksum for every tool
# on linux and macOS (x64/arm64). Bump a pin with `make outdated` → edit here →
# `mise install` (or `./install`), then commit both files. `make upgrade.tools`
# never rewrites pins — it moves within ranges and refreshes the lockfile.

[tools]
# ── Runtimes ──────────────────────────────────────────────────────────────────
go = "1.27"
node = "24"     # required by Mason (LSP installer inside neovim)
python = "3.13"
uv = "0.13.0"
ruff = "0.17.0"
# Rust tracks the upstream `stable` channel and is intentionally not reproducible
# from this file. Add a project `rust-toolchain.toml` when an exact compiler matters.
rust = "stable"
tmux = "3.7c"

# ── Build tooling ─────────────────────────────────────────────────────────────
# macOS ships GNU Make 3.81, which predates --output-sync: the parallel module
# pass then falls back to interleaved output. mise provisions a modern GNU Make
# here so Linux and macOS run `make all` identically.
make = "4"

# ── Kubernetes / Infra ────────────────────────────────────────────────────────
kubectl = "1.35.3"
helm = "4.1.3"
terraform = "1.14.8"

# ── Linting ───────────────────────────────────────────────────────────────────
shellcheck = "0.11.0"
shfmt = "3.14.1"

# ── Neovim + shell tooling ────────────────────────────────────────────────────
"aqua:neovim/neovim" = "0.12.6"
"github:junegunn/fzf" = "0.74.4"
"aqua:BurntSushi/ripgrep" = "15.2.0"
"aqua:sharkdp/fd" = "10.5.0"
"aqua:sharkdp/bat" = "0.26.1"
"aqua:jesseduffield/lazygit" = "0.66.0"
"conda:tig" = "2.6.1"
"conda:libqrencode" = "4.1.1"           # Provides the qrencode CLI.
# Register the bundled renderers so the conda installation supports PNG output.
"conda:graphviz" = { version = "14.1.2", postinstall = "dot -c" }
"aqua:cli/cli" = "2.102.0"
"aqua:starship/starship" = "1.26.0"
"aqua:docker/cli" = "29.9.0"
"cargo:stylua" = "2.5.2"
"aqua:jqlang/jq" = "1.8.2"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:getsops/sops" = "3.11.0"
"aqua:fullstorydev/grpcurl" = "1.9.4"

# ── Go tooling ────────────────────────────────────────────────────────────────
# Prebuilt binaries where upstream publishes them; goimports and govulncheck
# have no release assets, so they build via `go install` (go: backend).
# staticcheck releases are date-based (2026.2.2 is module v0.8.2).
"aqua:mvdan/gofumpt" = "0.12.0"
"github:dominikh/go-tools" = "2026.2.2"          # staticcheck
"go:golang.org/x/tools/cmd/goimports" = "0.52.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

# ── Personal tools ────────────────────────────────────────────────────────────
"github:kwtucker/temp-ssh-key" = "0.3.1"

# ── LSP servers ───────────────────────────────────────────────────────────────
"aqua:artempyanykh/marksman" = "2026-02-08"
"go:golang.org/x/tools/gopls" = "0.23.0"
"aqua:hashicorp/terraform-ls" = "0.39.0"
"aqua:terraform-linters/tflint" = "0.64.0"
"github:golangci/golangci-lint" = "2.14.0"
"aqua:terraform-docs/terraform-docs" = "0.24.0"
"aqua:charmbracelet/vhs" = "0.12.1"
"aqua:tsl0922/ttyd" = "1.7.7"
"conda:ffmpeg" = "9.0.2"

# ── AI agents ────────────────────────────────────────────────────────────────
# CLI only; the Copilot Desktop app is installed separately. MCP and skills are
# shared with Desktop via the user configuration, not a second tool install.
[tools."aqua:github/copilot-cli"]
version = "1.0.105"

# opencode v2 ships from opencode.ai rather than GitHub releases, so it needs
# mise's http backend. The "2" prefix resolves to the newest 2.x through
# version_list_url — a future v3 will not arrive without a deliberate bump
# here. Client-side only.
[tools."http:opencode"]
version = "2"
version_list_url = "https://opencode.ai/update/api/latest/cli/npm"
version_json_path = ".version"

# Upstream publishes no checksum sidecars. These SHA-256 digests are computed
# from the 2.3.0 artifacts (`curl -fsSL <url> | sha256sum`); replace all four
# when bumping `version`. The lockfile records the same values.
[tools."http:opencode".platforms]
linux-x64 = { url = "https://opencode.ai/files/bin/{{version}}/opencode-linux-x64.tar.gz", checksum = "sha256:fc0f81522aceeabac47693d88389efa2bc517ce74c2c38fd6967819fcc6e4d3b" }
linux-arm64 = { url = "https://opencode.ai/files/bin/{{version}}/opencode-linux-arm64.tar.gz", checksum = "sha256:3207fb5cdec448d479242c0f1a14f4f7bdfcad3a79209b5eb8f9003725e93711" }
macos-x64 = { url = "https://opencode.ai/files/bin/{{version}}/opencode-darwin-x64.zip", checksum = "sha256:79a4841925e3344d5bb4b000acf6c50b11de301e9047aa9bea9e288e77fe4249" }
macos-arm64 = { url = "https://opencode.ai/files/bin/{{version}}/opencode-darwin-arm64.zip", checksum = "sha256:7907df2b12720a840fbb49c5b978b9b82925b6bf75479a5fd216afa8932b6702" }

[settings]
go.set_gobin = false
not_found_auto_install = false
# Record exact versions, URLs, and checksums in mise.lock. `mise install`
# refreshes it when this file changes, so commit both together.
lockfile = true
# mise's default, made explicit: fuzzy selectors (go/node/python/make/rust) wait
# 24h for a new release. Exact pins and versions in mise.lock are exempt.
minimum_release_age = "24h"
