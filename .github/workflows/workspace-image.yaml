# .github/workflows/workspace-image.yaml — build + push public workspace image.
# Triggers on image/, dotfile modules baked into the image, or the workspace
# toolset. Multi-arch so Apple Silicon laptops and amd64 clouds share tags.
name: workspace-image

on:
  push:
    branches: [main]
    paths:
      - "image/**"
      - "mise.toml"
      - "zsh/**"
      - "nvim/**"
      - "fzf/**"
      - "tmux/**"
      - "git/**"
      - "golang/**"
      - "kubernetes/**"
      - "helm/**"
      - "bat/**"
      - "ripgrep/**"
      - "bin/**"
      - "psql/**"
      - "docker/**"
      - ".github/workflows/workspace-image.yaml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kwtucker/workspace

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
