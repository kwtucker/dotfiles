# .github/workflows/workspace-image.yaml — build + push public workspace image.
# Triggers on image/, dotfile modules baked into the image, or the workspace
# toolset. Multi-arch so Apple Silicon laptops and amd64 clouds share tags.
name: workspace-image

on:
  push:
    branches: [main]
    paths:
      - "image/**"
      - "mise.toml"
      - "zsh/**"
      - "nvim/**"
      - "fzf/**"
      - "tmux/**"
      - "git/**"
      - "golang/**"
      - "kubernetes/**"
      - "helm/**"
      - "bat/**"
      - "ripgrep/**"
      - "bin/**"
      - "psql/**"
      - "docker/**"
      - ".github/workflows/workspace-image.yaml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kwtucker/workspace

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Mason list sync
        run: |
          python3 - <<'EOF'
          import re, sys
          mason = open('nvim/lua/plugins/mason.lua').read()
          ws = sorted(re.findall(r'"([^"]+)"', mason.split('ensure_installed_workspace = {', 1)[1].split('}', 1)[0]))
          dock = open('image/Dockerfile').read()
          mi = sorted(re.search(r"MasonInstall ((?:[a-z0-9_.@-]+ ?)+)'", dock).group(1).split())
          if ws != mi:
              print("MISMATCH between mason.lua subset and Dockerfile MasonInstall list")
              print("mason.lua: ", ws)
              print("Dockerfile:", mi)
              sys.exit(1)
          print(f"Mason lists in sync ({len(ws)} packages)")
          EOF
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Ephemeral per-run token for api.github.com calls made by
          # mise/aqua during the build. Mounted as a BuildKit secret
          # (consumed via --mount in the Dockerfile), never baked in.
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
