# Plugins loaded with TPM

# Catppuccin
# ###########################

set -g @catppuccin_flavor "frappe"
set -g @catppuccin_status_background "#303446"

# Window styling
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"

# Inactive window separators
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator ""

# Inactive windows
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_text_color "#{@thm_surface_0}"
set -g @catppuccin_window_number_color "#{@thm_overlay_2}"

# Active window — preserve existing appearance
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag,(),}"
set -g @catppuccin_window_current_number "#I"
set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"
set -g @catppuccin_window_current_number_color "#{@thm_mauve}"

# Session module
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_session_bg_color "#{@thm_surface_0}"
set -g @catppuccin_session_color "#{@thm_lavender}"

# Session separators
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_fill "icon"

# Other modules
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_date_time_text "%Y-%m-%d %I:%M %p"
set -g @catppuccin_date_time_icon "null"
set -g @catppuccin_custom_plugin_dir "#{HOME}/.config/tmux/scripts"

# Pane styling
set -g @catppuccin_pane_border_style "fg=#585f65,bg=#585f65"
set -g @catppuccin_pane_active_border_style "none,fg=#585f65,bg=#585f65"
set -g @catppuccin_pane_color "#585f65"
set -g @catppuccin_pane_background_color "#585f65"

# SessionX
set -g @sessionx-bind "o"

# Tmux Fzf
set-environment -g TMUX_FZF_LAUNCH_KEY "F"
