# image/k8s/dev-pod.yaml — long-running remote-dev workspace.
# Public image: no imagePullSecrets needed. Runs as dev (1000) for
# restricted PSS compatibility. Work + Go caches live on the PVC so pod
# restarts don't wipe them.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace
  labels:
    app.kubernetes.io/name: workspace
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace
  labels:
    app.kubernetes.io/name: workspace
spec:
  replicas: 1
  strategy:
    type: Recreate # single writer to the PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: workspace
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workspace
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workspace
          image: ghcr.io/kwtucker/workspace:latest
          imagePullPolicy: Always
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 4
              memory: 8Gi
          env:
            - name: HOME
              value: /home/dev
            # Keep Go module + build caches on the PVC across restarts.
            - name: GOMODCACHE
              value: /home/dev/work/.cache/go/pkg/mod
            - name: GOCACHE
              value: /home/dev/work/.cache/go/build
            - name: GOPATH
              value: /home/dev/work/go
          volumeMounts:
            - name: work
              mountPath: /home/dev/work
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: workspace
