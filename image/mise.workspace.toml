# mise.workspace.toml — slim toolset for the public workspace image.
# Full local env lives in ../mise.toml; this file intentionally omits
# python, rust, terraform and LSPs you don't need for Go remote-dev + debug.
# Fonts are also omitted: Nerd Fonts render in your local terminal emulator,
# not inside the container (see ../fonts/Makefile).
#
# Versions below are PINNED (not `latest`) from the locally-installed,
# known-good set (2026-09-15). Rationale: every `latest` aqua/github tool
# resolves via api.github.com, and anonymous CI calls get rate-limited on
# shared runners — pinning makes builds reproducible and API-light.
# Refresh: run `mise outdated` on your laptop, bump versions here, push.

[tools]
# ── Runtimes ──────────────────────────────────────────────────────────────────
go   = "1.26"
node = "24" # required by Mason / LazyVim, not for app dev

# ── Kubernetes / debug ────────────────────────────────────────────────────────
kubectl = "1.35.3"
helm    = "4.1.3"
"aqua:derailed/k9s" = "0.51.0"
"aqua:stern/stern"  = "1.34.0"
"aqua:mikefarah/yq" = "4.53.6"

# ── Neovim + shell tooling ────────────────────────────────────────────────────
"aqua:neovim/neovim"         = "0.11.6"
"github:junegunn/fzf"        = "0.54.3"
"aqua:BurntSushi/ripgrep"    = "14.1.1"
"aqua:sharkdp/fd"            = "10.1.0"
"aqua:sharkdp/bat"           = "0.24.0"
"aqua:jesseduffield/lazygit" = "0.43.1"
"aqua:cli/cli"               = "2.52.0"
"aqua:starship/starship"     = "1.24.2"
"aqua:jqlang/jq"             = "1.8.2"

# ── Go dev ────────────────────────────────────────────────────────────────────
"go:golang.org/x/tools/gopls"   = "0.21.1"
"github:golangci/golangci-lint" = "1.60.3"

[settings]
not_found_auto_install = false
yes = true
